<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فراموشی رمز عبور | روبی باکس</title>

    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/pages/forgot.css">
    <link rel="icon" type="image/png" href="../assets/images/logo.png">
    <link rel="shortcut icon" href="../assets/images/logo.png">

    <!-- فاوآیکون -->
    <!-- <link rel="icon" type="image/png" href="../assets/images/logo-64.png"> -->
</head>
<body>

    <!-- پس‌زمینه خطوط متحرک -->
    <canvas id="bg-network" aria-hidden="true"></canvas>

    <main class="forgot-container">

        <div class="forgot-card">

            <div class="forgot-header">
                <img src="../assets/images/logo.png" alt="logo">
                <h2>بازیابی رمز عبور</h2>
                <p>ایمیل خود را وارد کنید تا لینک بازیابی برای شما ارسال شود</p>
            </div>

            <form class="forgot-form" action="#" method="post">

                <div class="field-group">
                    <label for="email">ایمیل:</label>
                    <input id="email" type="email" placeholder="email@example.com" required>
                </div>

                <button type="submit" class="btn btn-primary forgot-submit">
                    ارسال لینک بازیابی
                </button>

                <div class="forgot-footer">
                    <p>یادِت اومد؟</p>
                    <a href="signin.html">بازگشت به صفحه ورود</a>
                </div>

                <a class="back-home" href="../index.html">← بازگشت به خانه</a>

            </form>

        </div>

    </main>

    <!-- اسکریپت پس‌زمینه خطوط متحرک -->
    <script>
        (function () {
            const canvas = document.getElementById("bg-network");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");

            const DENSITY = 12000;
            const SPEED = 0.7;
            const LINK_DISTANCE = 180;

            let width, height, points;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                createPoints();
            }

            function createPoints() {
                const count = Math.floor((width * height) / DENSITY);
                points = [];
                for (let i = 0; i < count; i++) {
                    points.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vx: (Math.random() - 0.5) * SPEED,
                        vy: (Math.random() - 0.5) * SPEED
                    });
                }
            }

            function step() {
                ctx.clearRect(0, 0, width, height);

                ctx.fillStyle = "rgba(33, 150, 243, 0.7)";
                for (const p of points) {
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0 || p.x > width) p.vx *= -1;
                    if (p.y < 0 || p.y > height) p.vy *= -1;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                for (let i = 0; i < points.length; i++) {
                    for (let j = i + 1; j < points.length; j++) {
                        const p1 = points[i];
                        const p2 = points[j];
                        const dx = p1.x - p2.x;
                        const dy = p1.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < LINK_DISTANCE) {
                            const alpha = 1 - dist / LINK_DISTANCE;
                            ctx.strokeStyle = "rgba(33, 150, 243," + (0.25 * alpha) + ")";
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.stroke();
                        }
                    }
                }

                requestAnimationFrame(step);
            }

            window.addEventListener("resize", resize);
            resize();
            step();
        })();
    </script>

</body>
</html>
